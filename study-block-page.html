<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>পড়তে বস, ভাই!</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090d;
      --panel: #11131a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #ffcf4a;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(55, 76, 120, .22), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, "Noto Sans Bengali", "Hind Siliguri", sans-serif;
    }
    main {
      width: min(100%, 760px);
      text-align: center;
      padding: clamp(18px, 4vw, 34px);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.065), rgba(255,255,255,.018));
      box-shadow: 0 24px 80px rgba(0,0,0,.48);
    }
    .photo-wrap {
      width: min(100%, 390px);
      margin: 0 auto 24px;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: #17191f;
      box-shadow: 0 14px 40px rgba(0,0,0,.4);
    }
    .photo-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(25px, 5vw, 43px);
      line-height: 1.45;
      font-weight: 900;
      letter-spacing: -.5px;
    }
    .urgent {
      color: var(--accent);
      font-size: clamp(20px, 4vw, 31px);
      line-height: 1.5;
      font-weight: 900;
      margin: 0;
    }
    .english {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 2.5vw, 18px);
      font-weight: 750;
      letter-spacing: .08em;
    }
    .small {
      margin: 24px 0 0;
      color: #777985;
      font-size: 12px;
    }
  </style>
</head>
