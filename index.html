<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>পড়তে বস, ভাই!</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 22px;
  overflow: hidden; background:
  radial-gradient(ellipse at 15% 10%, rgba(48,68,112,.24), transparent 43%),
  radial-gradient(ellipse at 90% 90%, rgba(132,91,20,.10), transparent 38%), #08090d;
  color: #f5f5f7; font-family: system-ui, "Noto Sans Bengali", "Hind Siliguri", sans-serif;
}
.layout {
  width: min(1320px, 100%); min-height: min(724px, calc(100vh - 44px));
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
  align-items: center; gap: clamp(30px, 4vw, 62px); padding: clamp(26px, 4vw, 54px);
  border: 1px solid rgba(255,255,255,.12); border-radius: 26px;
  background: linear-gradient(135deg, rgba(255,255,255,.065), rgba(255,255,255,.018));
  box-shadow: 0 28px 90px rgba(0,0,0,.5);
}
.video-box {
  width: 100%; aspect-ratio: 20 / 9; display: grid; place-items: center;
  overflow: hidden; border: 1px solid rgba(255,255,255,.14); border-radius: 18px;
  background: #020307; box-shadow: 0 18px 48px rgba(0,0,0,.42);
}
video {
  display: block; width: 100%; height: 100%; object-fit: contain;
  object-position: center; background: #020307;
}
.message { min-width: 0; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.eyebrow { margin: 0 0 20px; color: #9b9da8; font-size: 12px; font-weight: 800; letter-spacing: .24em; }
h1 { margin: 0; max-width: 620px; font-size: clamp(36px, 4.1vw, 62px); line-height: 1.42; font-weight: 950; letter-spacing: -.035em; text-wrap: balance; }
.urgent { margin: 24px 0 0; color: #ffd34e; font-size: clamp(25px, 2.8vw, 39px); line-height: 1.5; font-weight: 900; text-wrap: balance; }
.english { margin: 22px 0 0; color: #d5d5db; font-size: clamp(15px, 1.5vw, 19px); font-weight: 850; letter-spacing: .13em; }
.footer { margin: 32px 0 0; color: #858793; font-size: 13px; line-height: 1.8; }
@media (max-width: 760px) {
  body { padding: 12px; overflow: auto; }
  .layout { min-height: calc(100vh - 24px); grid-template-columns: 1fr; gap: 26px; padding: 20px; }
  .video-box { width: 100%; }
  h1 { font-size: clamp(30px, 8vw, 43px); }
  .urgent { font-size: clamp(22px, 6vw, 30px); margin-top: 14px; }
  .footer { margin-top: 20px; }
}
</style>
</head>
